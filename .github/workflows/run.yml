name: arXiv-daily-ai-enhanced

on:
  schedule:
    - cron: "30 13 * * 1-5" # Monday-Friday 21:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: "new=新抓取；retry_failed=只补失败；resume_pending=只继续未处理"
        required: true
        default: new
        type: choice
        options:
          - new
          - retry_failed
          - resume_pending
      source_run_id:
        description: "恢复模式填写已归档的抓取运行 ID；new 留空"
        required: false
        type: string
      max_papers:
        description: "仅 new 生效：0=全部；首次验收保留3"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: lvr-paper-collection
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lvr-tracking') &&
      (github.event_name != 'schedule' || vars.BRIEF_AUTO_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGUAGE: Chinese
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.CV' }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'new' || inputs.mode || 'new' }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
      MAX_PAPERS: ${{ github.event_name == 'schedule' && (vars.DAILY_MAX_PAPERS || '0') || inputs.max_papers || '3' }}
      AI_WORKERS: ${{ vars.AI_MAX_WORKERS || '2' }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout selected code revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Check configuration before any paid requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: |
          node --check js/app.js
          uv run --frozen python tracking/brief_workflow.py check

      - name: Read archived checkpoints for recovery
        if: env.RUN_MODE != 'new'
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-store
          persist-credentials: false

      - name: Prepare new inputs or restore the original batch
        id: prepare
        run: uv run --frozen python tracking/brief_workflow.py prepare

      - name: Analyze selected papers once and save each result
        id: analyze
        if: steps.prepare.outputs.selected_count != '0'
        continue-on-error: true
        timeout-minutes: 300
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          BATCH_DATE: ${{ steps.prepare.outputs.run_date }}
          ANALYSIS_MODE: ${{ steps.prepare.outputs.analysis_mode }}
        run: |
          uv run --frozen python ai/enhance_brief.py \
            --data "run-output/data/${BATCH_DATE}.jsonl" \
            --output "run-output/data/${BATCH_DATE}_AI_brief_Chinese.jsonl" \
            --checkpoint-dir run-output/brief-progress \
            --mode "$ANALYSIS_MODE" \
            --max_workers "$AI_WORKERS"

      - name: Rebuild exports, validate checkpoints and write the report
        id: finish
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
        run: uv run --frozen python tracking/brief_workflow.py finish

      - name: Upload saved outcomes and diagnostics even after failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lvr-batch-result
          path: run-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark collection outcome
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          VALIDATION_OUTCOME: ${{ steps.finish.outcome }}
          READY_FOR_PUBLICATION: ${{ steps.finish.outputs.ready_for_publication }}
        run: |
          if [ "$VALIDATION_OUTCOME" != "success" ]; then
            echo "Checkpoint validation failed; inspect the saved diagnostics."
            exit 1
          fi
          if [ "$READY_FOR_PUBLICATION" != "true" ]; then
            echo "No publishable batch yet. Main-branch saved outcomes will be archived; the existing website stays unchanged."
            exit 1
          fi
          echo "LVR_BRIEF_COLLECTION_PASSED"
