name: Publish LVR Results and Website

on:
  workflow_run:
    workflows: [arXiv-daily-ai-enhanced]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "手动补发/归档时填写抓取运行 ID；复用已有结果，不重新分析"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lvr-data-and-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}

    steps:
      - name: Checkout website and publishing code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Verify collection provenance and find its saved artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tracking/brief_workflow.py source

      - name: Download the existing batch result
        if: steps.source.outputs.has_artifact == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lvr-batch-result
          path: batch-result
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate results and choose publication or archival
        id: plan
        if: steps.source.outputs.has_artifact == 'true'
        run: uv run --frozen python tracking/brief_workflow.py publication-plan

      - name: Checkout existing data history
        if: steps.plan.outputs.action == 'publish' || steps.plan.outputs.action == 'archive'
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-store
          persist-credentials: true

      - name: Save brief recovery state before building the website
        if: steps.plan.outputs.is_brief == 'true'
        run: |
          uv run --frozen python tracking/publish_results.py \
            --artifact batch-result \
            --data-checkout data-store \
            --source-run source-run.json \
            --state-only

      - name: Commit recovery state to the data branch
        if: steps.plan.outputs.is_brief == 'true'
        working-directory: data-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runs
          if ! git diff --cached --quiet; then
            git commit -m "data: archive brief batch ${SOURCE_RUN_ID}"
          fi
          git push origin HEAD:refs/heads/data

      - name: Merge successful results and build the website
        if: steps.plan.outputs.action == 'publish'
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          uv run --frozen python tracking/publish_results.py \
            --artifact batch-result \
            --data-checkout data-store \
            --source-run source-run.json \
            --site _site
          node --check _site/js/app.js
          node --check _site/js/data-config.js
          node --check _site/js/auth-config.js

      - name: Commit merged results to the data branch
        if: steps.plan.outputs.action == 'publish'
        working-directory: data-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data assets/file-list.txt runs
          if ! git diff --cached --quiet; then
            git commit -m "data: publish brief batch ${SOURCE_RUN_ID}"
          fi
          git push origin HEAD:refs/heads/data

      - name: Configure GitHub Pages
        if: steps.plan.outputs.action == 'publish'
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        id: site_upload
        if: steps.plan.outputs.action == 'publish'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Create Pages deployment using the uploaded artifact ID
        id: pages_request
        if: steps.plan.outputs.action == 'publish'
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.site_upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('The website upload did not return a valid artifact ID.')
            }
            const payload = {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            }
            for (let attempt = 1; ; attempt++) {
              try {
                const {data} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', payload)
                const deploymentId = data.id || context.sha
                core.setOutput('deployment_id', deploymentId)
                core.setOutput('page_url', data.page_url)
                core.info(`Pages accepted artifact ${artifactId} as deployment ${deploymentId}.`)
                return
              } catch (error) {
                const message = error.response?.data?.message || error.message
                const missing = /artifact/i.test(message) && /not found|not (yet )?(available|ready)|does not exist|could not (find|be found)/i.test(message)
                // Retry only when Pages explicitly rejected an unavailable artifact.
                if (attempt === 4 || ![400, 404, 422].includes(error.status) || !missing) {
                  throw new Error(`Pages API could not create a deployment for artifact ${artifactId} (HTTP ${error.status || 'unknown'}): ${message}`)
                }
                const seconds = 5 * 2 ** (attempt - 1)
                core.warning(`Pages cannot read artifact ${artifactId} yet. Retrying in ${seconds}s.`)
                await new Promise(resolve => setTimeout(resolve, seconds * 1000))
              }
            }

      - name: Wait for GitHub Pages deployment
        id: deployment
        if: steps.plan.outputs.action == 'publish'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.pages_request.outputs.deployment_id }}
          PAGE_URL: ${{ steps.pages_request.outputs.page_url }}
        with:
          script: |
            const target = {...context.repo, pages_deployment_id: process.env.DEPLOYMENT_ID}
            const failures = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ])
            const deadline = Date.now() + 10 * 60_000
            let previous
            while (Date.now() < deadline) {
              let status
              try {
                const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', target)
                status = data.status
              } catch (error) {
                if (error.status && error.status < 500 && ![404, 408, 429].includes(error.status)) throw error
                status = `Waiting for deployment status (HTTP ${error.status || 'unavailable'})`
              }
              if (status !== previous) core.info(`Pages deployment ${target.pages_deployment_id}: ${status}`)
              previous = status
              if (status === 'succeed' || failures.has(status)) {
                core.setOutput('finished', 'true')
                if (status !== 'succeed') throw new Error(`Pages ended with status ${status}.`)
                core.setOutput('page_url', process.env.PAGE_URL)
                return
              }
              await new Promise(resolve => setTimeout(resolve, 10_000))
            }
            throw new Error('Timed out waiting for GitHub Pages after 10 minutes.')

      - name: Cancel unfinished Pages deployment
        if: >-
          (failure() || cancelled()) && steps.pages_request.outputs.deployment_id != '' &&
          steps.deployment.outputs.finished != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.pages_request.outputs.deployment_id }}
        run: gh api --method POST --silent "repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOYMENT_ID/cancel"

      - name: Record publication or archival
        if: steps.plan.outputs.action == 'publish' || steps.plan.outputs.action == 'archive'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: uv run --frozen python tracking/brief_workflow.py publication-summary

      - name: Upload publication details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lvr-publication-details
          path: publication.json
          if-no-files-found: ignore
          retention-days: 30
